syntax = "proto3";
import "google/protobuf/empty.proto";

package ns_controller.pb;

enum Button {
  // Face
  A = 0;
  B = 1;
  X = 2;
  Y = 3;

  // Shoulders (Z* are digital on Switch)
  L = 4;
  R = 5;
  ZL = 6;
  ZR = 7;

  // Stick-clicks
  L_STICK = 8;   // L3
  R_STICK = 9;  // R3

  // System
  PLUS = 10;
  MINUS = 11;
  HOME = 12;
  CAPTURE = 13;

  // D-Pad (treated as 4 digital buttons; host may also synthesize a hat)
  DPAD_UP = 14;
  DPAD_DOWN = 15;
  DPAD_LEFT = 16;
  DPAD_RIGHT = 17;

  // Joy-Con SL/SR (useful when emulating single Joy-Con)
  SL = 18;
  SR = 19;
}

enum Stick {
  LS = 0;
  RS = 1;
}

message Position {
  // Range: -1..1
  float x = 1;
  float y = 2;
}

message ControllerState {
  uint64 buttons = 1;
  Position ls = 2;
  Position rs = 3;
}

message ClickRequest {
  repeated Button buttons = 1;
  float duration = 2;
}

message PressRequest {
  repeated Button buttons = 1;
}

message ReleaseRequest {
  repeated Button buttons = 1;
}

message StickRequest {
  Stick stick = 1;
  Position position = 2;
}

// --- Macro actions ---

message ClickAction {
  repeated Button buttons = 1;
  uint32 down_ms = 2;          // hold duration (default 100ms)
  uint32 gap_ms = 3;           // gap after release (default 100ms)
  optional string mark = 4;   // if set, record a time mark at the press
}

message RepeatClickAction {
  repeated Button buttons = 1;
  uint32 count = 2;            // number of clicks
  uint32 down_ms = 3;          // hold duration per click (default 100ms)
  uint32 gap_ms = 4;           // gap between clicks (default 100ms)
  optional string mark = 5;   // if set, record a time mark at the first press
}

message HoldAction {
  repeated Button buttons = 1;
  uint32 duration_ms = 2;      // how long to hold before releasing
  optional string mark = 3;   // if set, record a time mark at the press
}

message WaitAction {
  uint32 duration_ms = 1;      // relative wait from now
}

message SpamAction {
  repeated Button buttons = 1;
  uint32 duration_ms = 2;      // total spam duration
  uint32 interval_ms = 3;      // click cycle interval (default 100)
}

message SetMarkAction {
  string name = 1;             // name of the time anchor
}

message WaitUntilAction {
  string mark = 1;             // reference mark name
  uint32 offset_ms = 2;        // wait until marks[name] + offset
}

message SetStickAction {
  Stick stick = 1;
  Position position = 2;
  uint32 duration_ms = 3;      // 0 = set and continue (no auto-release)
}

message MacroAction {
  oneof action {
    ClickAction click = 1;
    HoldAction hold = 2;
    WaitAction wait = 3;
    SpamAction spam = 4;
    SetMarkAction set_mark = 5;
    WaitUntilAction wait_until = 6;
    SetStickAction set_stick = 7;
    RepeatClickAction repeat_click = 8;
  }
}

message Macro {
  repeated MacroAction actions = 1;
}

message MacroEvent {
  uint32 action_index = 1;     // which action (0-based)
  string description = 2;      // human-readable summary
  bool completed = 3;          // true when entire macro is done
  bool error = 4;
  string error_message = 5;
}

service NsController {
  rpc Click(ClickRequest) returns (ControllerState);
  rpc Press(PressRequest) returns (ControllerState);
  rpc Release(ReleaseRequest) returns (ControllerState);
  rpc SetStick(StickRequest) returns (ControllerState);
  rpc SetState(ControllerState) returns (ControllerState);
  rpc GetState(google.protobuf.Empty) returns (ControllerState);
  rpc Clear(google.protobuf.Empty) returns (ControllerState);

  // Execute a macro on the server with monotonic clock timing.
  // Streams progress events back; cancel the stream to abort.
  rpc RunMacro(Macro) returns (stream MacroEvent);
}
