syntax = "proto3";
import "google/protobuf/empty.proto";

package ns_controller.pb;

enum Button {
  // Face
  A = 0;
  B = 1;
  X = 2;
  Y = 3;

  // Shoulders (Z* are digital on Switch)
  L = 4;
  R = 5;
  ZL = 6;
  ZR = 7;

  // Stick-clicks
  L_STICK = 8;   // L3
  R_STICK = 9;  // R3

  // System
  PLUS = 10;
  MINUS = 11;
  HOME = 12;
  CAPTURE = 13;

  // D-Pad (treated as 4 digital buttons; host may also synthesize a hat)
  DPAD_UP = 14;
  DPAD_DOWN = 15;
  DPAD_LEFT = 16;
  DPAD_RIGHT = 17;

  // Joy-Con SL/SR (useful when emulating single Joy-Con)
  SL = 18;
  SR = 19;
}

enum Stick {
  LS = 0;
  RS = 1;
}

message Position {
  // Range: -1..1
  float x = 1;
  float y = 2;
}

message ControllerState {
  uint64 buttons = 1;
  Position ls = 2;
  Position rs = 3;
}

message ClickRequest {
  repeated Button buttons = 1;
  float duration = 2;
}

message PressRequest {
  repeated Button buttons = 1;
}

message ReleaseRequest {
  repeated Button buttons = 1;
}

message StickRequest {
  Stick stick = 1;
  Position position = 2;
}

service NsController {
  rpc Click(ClickRequest) returns (ControllerState);
  rpc Press(PressRequest) returns (ControllerState);
  rpc Release(ReleaseRequest) returns (ControllerState);
  rpc SetStick(StickRequest) returns (ControllerState);
  rpc SetState(ControllerState) returns (ControllerState);
  rpc GetState(google.protobuf.Empty) returns (ControllerState);
  rpc Clear(google.protobuf.Empty) returns (ControllerState);
}
