[project]
name = "nsctl"
version = "0.2.0"
description = "Brain-side client for the ns-controller Pico firmware (serial protocol, CLI)"
authors = [{name = "Dylan Meadows", email = "dylmeadows@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.0",
    "loguru>=0.7.3",
    "pyserial>=3.5",
]

[project.scripts]
nsctl = "nsctl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nsctl"]

[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]
