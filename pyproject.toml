[project]
name = "ns-controller"
version = "0.1.0"
description = "Nintendo Switch Pro Controller emulator over USB with TCP server"
authors = [
    {name = "Dylan Meadows", email = "dylmeadows@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.0",
    "loguru>=0.7.3",
    "grpcio>=1.76.0",
    "python-dotenv>=1.2.1",
    "types-protobuf>=6.32.1.20251210",
    "evdev>=1.9.3; sys_platform == 'linux'",
]

[project.scripts]
ns-controller = "ns_controller.server:cli"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
    "grpcio-tools>=1.76.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
exclude = [".venv", "__pycache__", "build", "dist"]
line-length = 120
indent-width = 4
[tool.ruff.format]
quote-style = "double"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]
[tool.ruff.lint.mccabe]
max-complexity = 20

