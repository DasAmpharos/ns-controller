---
# Self-hosted Renovate: keeps both uv.lock files, the Pico SDK version and the workflow pins
# current. Updates come on Saturdays; they merge into main once CI passes, without pull requests, except
# a new Pico SDK, which opens one (see renovate.json5).
# Needs the repository secret RENOVATE_TOKEN: a fine-grained personal access token with access to this
# repository, with Contents, Pull requests, Issues, Commit statuses and Workflows set to read and write
# (README, "Dependency updates").
name: Renovate

on:
  schedule:
    # Before 5 AM Eastern, with room for GitHub delaying scheduled runs: the "* 0-5 ..." schedules in
    # renovate.json5 (and "before 6am") only match runs before 6 AM.
    - cron: "37 8 * * *" # daily, 3:37 or 4:37 AM Eastern
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.216.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The repository config already exists, so no onboarding PR; and never run without it.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
          # Commit as Renovate with your GitHub noreply address, not Mend's default
          # renovate@whitesourcesoftware.com (a Mend-owned account that flags these commits as Unverified).
          RENOVATE_GIT_AUTHOR: "Renovate <25057051+DasAmpharos@users.noreply.github.com>"
